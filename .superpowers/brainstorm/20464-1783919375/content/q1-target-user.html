<h2>Q1: 目标用户是谁？</h2>
<p class="subtitle">你的AI工作流自动化工具主要面向哪类用户？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>普通用户 / 非技术人员</h3>
      <p>通过自然语言描述就能创建自动化流程，UI 要极简、零代码、像聊天一样交互</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>技术爱好者 / 个人开发者</h3>
      <p>需要灵活的编排能力，支持代码节点，可自托管，追求可扩展性</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>企业 / 团队用户</h3>
      <p>多租户、权限管理、审批流、企业系统集成（Slack/飞书/Jira）、审计日志</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>全能型 — 从个人到企业都要覆盖</h3>
      <p>先做个人版快速验证，再逐步扩展到企业功能</p>
    </div>
  </div>
</div>
