<h2>Q4: 技术栈偏好</h2>
<p class="subtitle">在开始架构设计前，先确定技术栈。以下哪个方向更符合你的偏好？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>全栈 TypeScript</h3>
      <p>前端 React/Vue + 后端 Node.js/Next.js，统一语言，生态丰富，前后端类型共享</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Python 生态</h3>
      <p>后端 Python (FastAPI)，前端 React/Vue。AI/ML 生态最强，LangChain/LlamaIndex 天然适配</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Go + 前端</h3>
      <p>后端 Go (高性能并发)，前端 React/Vue。适合高吞吐场景，单二进制部署方便</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>不纠结，你来推荐</h3>
      <p>根据项目特点（Agent、工作流、可视化）推荐最佳组合</p>
    </div>
  </div>
</div>
